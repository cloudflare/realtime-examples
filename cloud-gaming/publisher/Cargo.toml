[package]
name = "cloud-gaming-publisher"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
anyhow = "1.0.100"
bytes = "1.11.0"
clap = { version = "4.5.60", features = ["derive", "env"] }
ffmpeg-next = { version = "=8.1.0", default-features = false, features = ["codec", "format", "software-scaling"] }
libpulse-binding = "2.30.1"
libpulse-simple-binding = "2.29.0"
memmap2 = "0.9.9"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
uuid = { version = "1.19.0", features = ["v4"] }
webrtc = "=0.17.1"
x11rb = { version = "=0.13.2", features = ["shm", "xtest"] }
