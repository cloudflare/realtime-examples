version: 1
id: video-room
title: Custom video room
summary: Publish and subscribe to browser audio and video through raw Realtime SFU sessions.
maturity: experimental
status: active

topology:
  publishers: many
  subscribers: many
  media:
    - audio
    - video
  datachannels: false

components:
  - browser
  - Worker
  - Durable Object
  - Durable Object WebSocket
  - Realtime SFU

entrypoints:
  source: https://github.com/cloudflare/realtime-examples/tree/main/video-room
  demo: null
  docs: null

security:
  browser_has_sfu_secret: false
  authentication: PRODUCTION.md#authentication
  authorization: PRODUCTION.md#authorization

lifecycle:
  reconnect: ARCHITECTURE.md#reconnect
  cleanup: ARCHITECTURE.md#cleanup

ci:
  node_version: "22"
  install: npm ci
  checks:
    - name: Check
      run: npm run check
  browser_asset_paths:
    - dist/client

maintainer: null
